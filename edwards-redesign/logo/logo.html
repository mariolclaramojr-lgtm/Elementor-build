<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.logo{display:inline-flex;align-items:center;gap:15px;padding:4px;font-family:"Plus Jakarta Sans",sans-serif;color:var(--fg)}
.mark{width:46px;height:46px;display:grid;place-items:center;border:1.5px solid #DB783C;color:#DB783C;font-size:25px;font-weight:400;position:relative;border-radius:8px;box-sizing:border-box}
.mark::after{content:"";position:absolute;inset:4px;border:1px solid rgba(219,120,60,.35);border-radius:5px}
.t{display:flex;flex-direction:column;line-height:1}
.n{font-weight:700;font-size:19px;letter-spacing:.22em}
.s{font-weight:600;font-size:9.5px;letter-spacing:.5em;color:#DB783C;margin-top:6px}
</style></head><body>
<div class="logo" id="w" style="--fg:#fff"><span class="mark">E</span><span class="t"><span class="n">EDWARDS</span><span class="s">CHURCH</span></span></div>
<br><div class="logo" id="d" style="--fg:#2F3E4C"><span class="mark">E</span><span class="t"><span class="n">EDWARDS</span><span class="s">CHURCH</span></span></div>
</body></html>
