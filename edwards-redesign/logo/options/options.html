<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#DB783C;--s:#2F3E4C;--d:#222D38}
body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:#EEF0F1;padding:40px;width:1240px}
h1{margin:0 0 6px;color:var(--s);font-size:28px;letter-spacing:-.02em}
p.sub{margin:0 0 28px;color:#4C5763}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #DADFE3}
.dark{background:var(--d);padding:30px 32px}
.light{background:#fff;padding:30px 32px;border-top:1px solid #DADFE3}
.cap{display:flex;gap:12px;align-items:baseline;padding:16px 32px 20px;border-top:1px solid #DADFE3}
.cap b{font-size:13px;letter-spacing:.2em;color:var(--a)}
.cap span{color:var(--s);font-weight:600}
.cap em{font-style:normal;color:#4C5763;font-size:14px;margin-left:auto}
.logo{display:inline-flex;align-items:center;gap:14px}
.logo svg{width:48px;height:48px;flex:none}
.t{display:flex;flex-direction:column;line-height:1}
.n{font-weight:700;font-size:20px;letter-spacing:.22em}
.c{font-weight:600;font-size:9.5px;letter-spacing:.5em;color:var(--a);margin-top:7px}
.dark .n{color:#fff}.light .n{color:var(--s)}
</style></head><body>
<h1>Edwards Church — logo icon options</h1>
<p class="sub">Same wordmark, six icon marks. Shown on the dark header and on white. All use the brand accent #DB783C.</p>
<div class="grid" id="g"></div>
<template id="icons">
<!-- 1 Cross in arch -->
<svg data-n="1" data-t="Arched Cross" data-d="A cross inside a church-window arch — classic, timeless" viewBox="0 0 48 48" fill="none" stroke="#DB783C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 44V21a15 15 0 0130 0v23z"/><path d="M24 15v21M17.5 22h13"/></svg>
<!-- 2 Dove -->
<svg data-n="2" data-t="Dove" data-d="A rising dove — the Holy Spirit, peace, welcome" viewBox="0 0 48 48" fill="#DB783C"><path d="M6 27c5-1 9.5 0 13.5 3.2 2.7-6.6 8.4-11.7 18.9-13.4-1.4 3.3-3.6 6-6.4 7.9 3.2.2 6.1-.4 8.7-1.9-3.4 8.5-11.4 14.4-21 14.4-3.9 0-7.4-1-10.4-2.8l-5.6 3.8 2.6-6.2C6.9 30.6 6.2 28.9 6 27z"/><circle cx="35.5" cy="15.5" r="1.4" fill="#fff"/></svg>
<!-- 3 Open book + cross -->
<svg data-n="3" data-t="Open Bible" data-d="An open Bible with a cross — rooted in the Word" viewBox="0 0 48 48" fill="none" stroke="#DB783C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 17c-4.5-3-10.5-4-17-4v24c6.5 0 12.5 1 17 4 4.5-3 10.5-4 17-4V13c-6.5 0-12.5 1-17 4zM24 17v24"/><path d="M24 4v9M20.5 7.5h7"/></svg>
<!-- 4 Flame/cross -->
<svg data-n="4" data-t="Cross & Flame" data-d="A cross rising from a flame — modern, energetic" viewBox="0 0 48 48"><path fill="#DB783C" d="M24 45c-8.3 0-14-5.6-14-13.2 0-6.4 4.3-10.6 7.4-14.6.7 3.2 2.3 5.6 4.6 6.9-.4-6.7 2-13 6.8-18.1-.6 6.3 1.2 10.3 4.6 13.9 3.5 3.7 4.6 7.6 4.6 11.9C38 39.4 32.3 45 24 45z"/><path d="M24 25v15M19 30h10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
<!-- 5 Monoline cross in circle -->
<svg data-n="5" data-t="Circle Cross" data-d="A cross framed in a ring — minimal and clean" viewBox="0 0 48 48" fill="none" stroke="#DB783C" stroke-linecap="round"><circle cx="24" cy="24" r="21" stroke-width="2"/><circle cx="24" cy="24" r="16.5" stroke-width="1" opacity=".45"/><path d="M24 11v26M16.5 19h15" stroke-width="2.6"/></svg>
<!-- 6 Wheat / harvest cross -->
<svg data-n="6" data-t="Wheat & Cross" data-d="Wheat stalks forming a cross — growth, harvest, generosity" viewBox="0 0 48 48" fill="none" stroke="#DB783C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 45V8M14 18h20"/><path d="M24 14c-3-1.5-4.5-4-4.5-7 3 1.2 4.5 3.7 4.5 7zM24 14c3-1.5 4.5-4 4.5-7-3 1.2-4.5 3.7-4.5 7zM24 26c-3.4-1.4-5.2-4-5.2-7.3 3.4 1.3 5.2 3.9 5.2 7.3zM24 26c3.4-1.4 5.2-4 5.2-7.3-3.4 1.3-5.2 3.9-5.2 7.3zM24 37c-3.6-1.4-5.6-4.1-5.6-7.6 3.6 1.4 5.6 4.1 5.6 7.6zM24 37c3.6-1.4 5.6-4.1 5.6-7.6-3.6 1.4-5.6 4.1-5.6 7.6z"/></svg>
</template>
<script>
const t=document.getElementById('icons').content, g=document.getElementById('g');
t.querySelectorAll('svg').forEach(s=>{
 const lg=(bg)=>`<div class="${bg}"><div class="logo">${s.outerHTML}<span class="t"><span class="n">EDWARDS</span><span class="c">CHURCH</span></span></div></div>`;
 g.insertAdjacentHTML('beforeend',`<div class="card">${lg('dark')}${lg('light')}<div class="cap"><b>OPTION ${s.dataset.n}</b><span>${s.dataset.t}</span><em>${s.dataset.d}</em></div></div>`);
});
</script></body></html>
