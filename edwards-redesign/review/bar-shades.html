<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:30px;background:#fff;font-family:"Plus Jakarta Sans",sans-serif;width:1100px}
.row{margin-bottom:22px}.lab{font-size:13px;font-weight:700;color:#2F3E4C;margin-bottom:8px}.lab span{font-weight:500;color:#4C5763}
.bar{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.35fr;color:#fff;border-radius:10px;overflow:hidden}
.it{display:flex;gap:12px;align-items:center;padding:16px 20px}.it:first-child{background:rgba(0,0,0,.14)}
.ic{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
.k{font-size:10px;font-weight:700;letter-spacing:.22em;opacity:.82}.v{font-size:15px;font-weight:600}</style></head><body>
<script>
const rows=[['Current',0,'#DB783C (Accent)'],['A · 15% darker',15,'subtle'],['B · 25% darker',25,'recommended'],['C · 35% darker',35,'deep / earthy']];
for(const [n,d,s] of rows){document.write(`<div class="row"><div class="lab">${n} <span>— ${s}</span></div><div class="bar" style="background:color-mix(in srgb,#DB783C ${100-d}%,#000)">`+
[['NEXT SERVICE','Wednesday 7pm · in 1d 2h'],['SUNDAYS','10am Worship'],['WEDNESDAYS','7pm Midweek'],['LOCATION','1234 Street, My Town']].map(([k,v])=>`<div class="it"><span class="ic"></span><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`).join('')+`</div></div>`)}
</script></body></html>
